<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
	<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

	<!-- Шрифт лежит рядом с сайтом: без сторонних CDN, которые тормозят из РФ. -->
	<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/Geometria.woff2" crossorigin />
	<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/Geometria-Bold.woff2" crossorigin />

	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
