name: Publish frontend to jsDelivr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gestaltist-cdn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(cdn):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build full frontend payload
        env:
          GESTALT_CDN_PUBLISH: '1'
        run: npm run build

      - name: Verify tiny generated document
        run: |
          test -f .vercel/output/static/index.html
          bytes=$(wc -c < .vercel/output/static/index.html)
          echo "generated index.html: ${bytes} bytes"
          test "${bytes}" -lt 10000

      - name: Publish payload into repository
        if: github.event_name == 'push'
        run: |
          rm -rf cdn
          mkdir -p cdn
          cp -a .vercel/output/static/. cdn/
          printf '%s\n' "$GITHUB_SHA" > .cdn-ready

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cdn .cdn-ready

          if git diff --cached --quiet; then
            echo "CDN payload unchanged"
            exit 0
          fi

          git commit -m "chore(cdn): publish frontend for $GITHUB_SHA"
          git push origin HEAD:main
